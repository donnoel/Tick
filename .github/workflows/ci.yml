name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'LICENSE.*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_SIMULATOR_VERSION: '26.5'
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/TestResults/Tick.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Tick.xcodeproj

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes
          xcodebuild -project Tick.xcodeproj -scheme Tick -showdestinations

      - name: Prepare simulator
        id: simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(bash Scripts/create-ci-simulator.sh "$IOS_SIMULATOR_VERSION")"
          echo "id=${SIMULATOR_ID}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: bash Scripts/ci.sh build '${{ steps.simulator.outputs.id }}'

      - name: Unit tests
        run: bash Scripts/ci.sh unit '${{ steps.simulator.outputs.id }}'

      - name: TickCore package tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: UI smoke tests
        run: bash Scripts/ci.sh ui-smoke '${{ steps.simulator.outputs.id }}'

      - name: Upload xcodebuild artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-artifacts
          path: |
            ${{ env.RESULT_BUNDLE }}
            TestResults/**/*.xcresult
            ${{ env.DERIVED_DATA }}/Logs/Test

name: UI Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ui-regression:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_SIMULATOR_VERSION: '26.5'
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/TestResults/Tick.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Tick.xcodeproj

      - name: Prepare simulator
        id: simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(bash Scripts/create-ci-simulator.sh "$IOS_SIMULATOR_VERSION")"
          echo "id=${SIMULATOR_ID}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: bash Scripts/ci.sh build '${{ steps.simulator.outputs.id }}'

      - name: Full UI regression suite
        run: bash Scripts/ci.sh ui '${{ steps.simulator.outputs.id }}'

      - name: Upload xcodebuild artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-ui-regression-artifacts
          path: |
            ${{ env.RESULT_BUNDLE }}
            TestResults/**/*.xcresult
            ${{ env.DERIVED_DATA }}/Logs/Test
